steps:
  # 1. Dockerfile ile imajı Artifact Registry için derle
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/yks-takip-sistemi:$COMMIT_SHA', '.']

  # 2. İmajı Artifact Registry'ye yükle
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/yks-takip-sistemi:$COMMIT_SHA']

  # 3. Cloud Run üzerine otomatik yayınla
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'yks-takip-sistemi'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/yks-takip-sistemi:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--allow-unauthenticated'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/yks-takip-sistemi:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
